targets:
  $default:
    sources:
      exclude:
        - example/**
    builders:
      freezed:
        options:
          build_extensions:
            '^{{dir}}/{{file}}.dart': '{{dir}}/generated/{{file}}.freezed.dart'
      source_gen:combining_builder:
        options:
          build_extensions:
            '^{{dir}}/{{file}}.dart': '{{dir}}/generated/{{file}}.g.dart'
      json_serializable:
        options:
          explicit_to_json: true
